name: deploy-apim

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: deploy-apim-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
      AKS_NAME: ${{ secrets.AKS_NAME }}
      APIM_NAME: ${{ secrets.APIM_NAME }}
      APIM_API_ID: ${{ secrets.APIM_API_ID }}
      APIM_API_PATH: ${{ secrets.APIM_API_PATH }}
      INGRESS_NAME: ${{ secrets.INGRESS_NAME }}
      INGRESS_NAMESPACE: ${{ secrets.INGRESS_NAMESPACE }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------
      # Azure Auth
      # ---------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required Azure providers
        run: |
          az provider register --namespace Microsoft.ContainerService --wait
          az provider register --namespace Microsoft.ApiManagement --wait

      # ---------------------------
      # Resolve Subscription
      # ---------------------------
      - name: Debug env vars
        run: |
          echo "RG=$AZ_RESOURCE_GROUP"
          echo "AKS=$AKS_NAME"
          echo "APIM=$APIM_NAME"


      - name: Resolve Subscription ID
        run: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          echo "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

      # ---------------------------
      # Get kubeconfig via REST (NO az aks get-credentials)
      # ---------------------------
      - name: Get AKS kubeconfig via REST
        run: |
          set -e

          az rest \
            --method POST \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ContainerService/managedClusters/$AKS_NAME/listClusterUserCredential?api-version=2023-07-01" \
            --query "kubeconfigs[0].value" \
            -o tsv | base64 --decode > kubeconfig

          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV
          
          
            # ---------------------------
      # Verify kubectl context (IMPORTANT)
      # ---------------------------
      - name: Verify AKS access
        run: |
          set -e
          kubectl config current-context
          kubectl get nodes


      # ---------------------------
      # Get Ingress Public IP
      # ---------------------------
      - name: Get Ingress Public IP
        run: |
          set -e

          IP=$(kubectl get ingress "$INGRESS_NAME" -n "$INGRESS_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          if [ -z "$IP" ]; then
            echo "❌ Ingress IP not ready"
            exit 1
          fi

          echo "INGRESS_IP=$IP" >> $GITHUB_ENV
          echo "Ingress IP => $IP"
      
      

      # ---------------------------
      # Create / Update APIM Backend
      # ---------------------------
      - name: Create/Update APIM Backend (aks-ingress-backend)
        run: |
          BACKEND_URL="http://$INGRESS_IP"

          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/backends/aks-ingress-backend?api-version=2022-08-01" \
            --body "{
              \"properties\": {
                \"url\": \"$BACKEND_URL\",
                \"protocol\": \"http\"
              }
            }"

      # ---------------------------
      # Create / Update API
      # ---------------------------
      - name: Create/Update APIM API
        run: |
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/apis/$APIM_API_ID?api-version=2022-08-01" \
            --headers "Content-Type=application/json" \
            --body "@apis/cardops-api.json"

      # ---------------------------
      # Operations
      # ---------------------------
      - name: Create/Update Operation - Create Transaction
        run: |
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/apis/$APIM_API_ID/operations/create-transaction?api-version=2022-08-01" \
            --body "{
              \"properties\": {
                \"displayName\": \"Create Transaction\",
                \"method\": \"POST\",
                \"urlTemplate\": \"/api/transactions\",
                \"responses\": []
              }
            }"

      - name: Create/Update Operation - Health
        run: |
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/apis/$APIM_API_ID/operations/health?api-version=2022-08-01" \
            --body "{
              \"properties\": {
                \"displayName\": \"Health\",
                \"method\": \"GET\",
                \"urlTemplate\": \"/actuator/health\",
                \"responses\": []
              }
            }"

      # ---------------------------
      # Apply Policy
      # ---------------------------
      - name: Apply API Policy
        run: |
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AZ_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/apis/$APIM_API_ID/policies/policy?api-version=2022-08-01" \
            --headers "Content-Type=application/vnd.ms-azure-apim.policy+xml" \
            --headers "If-Match=*" \
            --body "@policies/cardops-policy.xml"
      
      
      

      # ---------------------------
      # Done
      # ---------------------------
      - name: Done
        run: |
          echo "===================================="
          echo "APIM deployed OK ✅"
          echo "Gateway: https://$APIM_NAME.azure-api.net/$APIM_API_PATH"
          echo "POST /api/transactions"
          echo "GET  /actuator/health"
          echo "Backend => http://$INGRESS_IP"
          echo "===================================="
